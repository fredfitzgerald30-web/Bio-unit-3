<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one study column; header with a cell mark and session tally; six recall modes as tabs; SVG cell diagrams use organelle color tokens */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#16211C; --muted:#56655D; --line:#D3DCD6;
  --accent:#1E7A55; --accent-soft:#DDEFE5; --accent-ink:#FFFFFF;
  --good:#22713A; --good-soft:#E1F1E5; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#9A6700; --warn-soft:#F7EDD3;
  --cyto:#F2F8EF; --memb:#2F7A4F; --nuc:#E7DFF6; --nucS:#6B4FB0; --mito:#FBE1CD; --mitoS:#C2621F;
  --chl:#CDEBC4; --chlS:#2E8B3A; --golgi:#1F8A8A; --er:#3A6FB8; --lyso:#F6CBD3; --lysoS:#C0394F;
  --vac:#DCEEF9; --vacS:#4A90B8; --wall:#C9BB82; --wallS:#8A7A3E; --ribo:#2B2F2D; --cytosk:#8E9A93;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --sunk:#121815; --ink:#E4ECE7; --muted:#97A69E; --line:#29352F;
  --accent:#6CC796; --accent-soft:#183326; --accent-ink:#0A1A12;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; --warn:#E3B54B; --warn-soft:#3A2F14;
  --cyto:#18241D; --memb:#6CC08E; --nuc:#2C2443; --nucS:#A68BEA; --mito:#46301F; --mitoS:#F09A5C;
  --chl:#21402A; --chlS:#6FCB7E; --golgi:#5CC9C9; --er:#7FA8E8; --lyso:#47222A; --lysoS:#F07B8E;
  --vac:#1B3345; --vacS:#7CB8DD; --wall:#4A4326; --wallS:#BBA862; --ribo:#D7DED9; --cytosk:#6F7D75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --sunk:#121815; --ink:#E4ECE7; --muted:#97A69E; --line:#29352F;
  --accent:#6CC796; --accent-soft:#183326; --accent-ink:#0A1A12;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; --warn:#E3B54B; --warn-soft:#3A2F14;
  --cyto:#18241D; --memb:#6CC08E; --nuc:#2C2443; --nucS:#A68BEA; --mito:#46301F; --mitoS:#F09A5C;
  --chl:#21402A; --chlS:#6FCB7E; --golgi:#5CC9C9; --er:#7FA8E8; --lyso:#47222A; --lysoS:#F07B8E;
  --vac:#1B3345; --vacS:#7CB8DD; --wall:#4A4326; --wallS:#BBA862; --ribo:#D7DED9; --cytosk:#6F7D75; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none;width:50px;height:50px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(28px,6vw,38px);line-height:1.05}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.tally b{display:block;font-size:26px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

nav.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:16px 48px;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:grid;gap:14px;min-width:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.prompt{margin:0;font-size:clamp(19px,3.4vw,23px);line-height:1.4;font-weight:600;text-wrap:pretty}
.prompt.term{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(28px,5.5vw,36px)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--good);background:var(--good-soft)} input.no{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)} .btn.bad{border-color:var(--bad);color:var(--bad)} .btn.mid{border-color:var(--warn);color:var(--warn)}
.btn.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
button:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:54px;line-height:1;margin:0}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:3px 9px;font-size:14px;font-weight:600}

.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.mc{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);font:600 15px var(--body);padding:11px 13px;border-radius:10px;cursor:pointer;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.dim{opacity:.55}
.opt[disabled]{cursor:default}

.fb{border-radius:10px;padding:12px 14px;display:grid;gap:5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--accent-soft)} .fb.acc{background:var(--warn-soft)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)} .fb.info strong{color:var(--accent)} .fb.acc strong{color:var(--warn)}
.fb p{margin:0}
.answer{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}

.diagram{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto}
.diagram svg{width:100%;min-width:520px;height:auto;display:block}
svg .badge circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg .badge text{fill:var(--ink);font:700 13px var(--mono)}
svg .badge.ok circle{fill:var(--good-soft);stroke:var(--good)} svg .badge.no circle{fill:var(--bad-soft);stroke:var(--bad)}
svg .lead{stroke:var(--muted);stroke-width:1.2}
svg .pin{fill:var(--ink)}
svg .nm{font:600 11px var(--body)}
svg .nm.ok{fill:var(--good)} svg .nm.no{fill:var(--bad)}
.lblgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
@media (max-width:480px){.lblgrid{grid-template-columns:minmax(0,1fr)}}
.lbl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center}
.lbl b{font-family:var(--mono);text-align:right;color:var(--accent)}
.lbl .fix{grid-column:2;font-size:13px;font-weight:700;color:var(--bad)}

.cmp{width:100%;border-collapse:collapse}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cmp td:first-child,.cmp th:first-child{text-align:left;font-weight:600}
.cmp td.note{grid-column:1/-1}
.tg{width:44px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--sunk);color:var(--muted);font:700 16px var(--body);cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tg.ok{box-shadow:0 0 0 2.5px var(--good)} .tg.no{box-shadow:0 0 0 2.5px var(--bad)}
.cmpnote{font-size:13px;color:var(--muted);text-align:left!important;font-weight:400!important;padding-top:0!important}

.seg3{display:grid;gap:10px}
.seg3 .q{display:grid;gap:6px}
.seg3 .q b{font-size:15px}
.seg3 .opts{display:flex;flex-wrap:wrap;gap:6px}
.seg3 button{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);font:600 15px var(--body);padding:8px 13px;border-radius:9px;cursor:pointer}
.seg3 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg3 button.ok{border-color:var(--good);background:var(--good-soft)} .seg3 button.no{border-color:var(--bad);background:var(--bad-soft)}
.beaker{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.beaker svg{width:150px;height:auto;flex:none}

ul.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--sunk)}
ul.check input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
ul.check label.on{border-color:var(--good);background:var(--good-soft)}
.auto{font-family:var(--mono);font-size:11px;color:var(--good);margin-left:auto;white-space:nowrap;padding-left:8px}

details.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sheet summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.sheet summary::-webkit-details-marker{display:none}
details.sheet summary::after{content:"Show";font-family:var(--mono);font-size:12px;color:var(--accent)}
details.sheet[open] summary::after{content:"Hide"}
.sheet-body{border-top:1px solid var(--line);padding:4px clamp(14px,3vw,22px) 12px}
.sheet-body h4{margin:16px 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.def{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 14px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.def b{font-weight:700}
.def .fixed{grid-column:1/-1;font-size:13px;color:var(--warn)}
@media (max-width:480px){.def{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(3px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap head">
    <div class="brand">
      <svg viewBox="0 0 50 50" aria-hidden="true">
        <ellipse cx="25" cy="25" rx="22" ry="18" fill="var(--cyto)" stroke="var(--memb)" stroke-width="2.5"/>
        <circle cx="21" cy="24" r="8" fill="var(--nuc)" stroke="var(--nucS)" stroke-width="1.6"/>
        <circle cx="19.5" cy="23" r="2.6" fill="var(--nucS)"/>
        <ellipse cx="36" cy="18" rx="5" ry="2.6" fill="var(--mito)" stroke="var(--mitoS)" stroke-width="1.2" transform="rotate(-20 36 18)"/>
        <path d="M31 30q4-2.5 8 0M31.5 33q3.5-2 7 0" stroke="var(--golgi)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <p class="eyebrow">Biology · Cell structure &amp; function</p>
        <h1>Cell Lab</h1>
      </div>
    </div>
    <div class="tally"><b id="tally">0 / 0</b>correct this session</div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Study modes">
    <button role="tab" id="tab-mc" data-tab="mc" aria-selected="true">Multiple choice</button>
    <button role="tab" id="tab-vocab" data-tab="vocab" aria-selected="false">Vocab</button>
    <button role="tab" id="tab-label" data-tab="label" aria-selected="false">Label the cell</button>
    <button role="tab" id="tab-cmp" data-tab="cmp" aria-selected="false">Compare cells</button>
    <button role="tab" id="tab-osm" data-tab="osm" aria-selected="false">Osmosis</button>
    <button role="tab" id="tab-exp" data-tab="exp" aria-selected="false">Explain it</button>
  </nav>
</div>

<main class="wrap">
  <details class="sheet"><summary>My notes</summary><div class="sheet-body" id="sheet-body"></div></details>
  <section id="pane-mc" role="tabpanel" aria-labelledby="tab-mc"><div class="bar"><div class="chips" id="mc-filter"></div><span class="count" id="mc-count"></span></div><div id="mc-card"></div></section>
  <section id="pane-vocab" role="tabpanel" aria-labelledby="tab-vocab" hidden><div class="bar"><div class="chips" id="vocab-filter"></div><div class="chips" id="vocab-dir"></div></div><div id="vocab-card"></div></section>
  <section id="pane-label" role="tabpanel" aria-labelledby="tab-label" hidden><div class="bar"><div class="chips" id="label-filter"></div><span class="count" id="label-count"></span></div><div id="label-card"></div></section>
  <section id="pane-cmp" role="tabpanel" aria-labelledby="tab-cmp" hidden><div class="bar"><span class="count" id="cmp-count"></span></div><div id="cmp-card"></div></section>
  <section id="pane-osm" role="tabpanel" aria-labelledby="tab-osm" hidden><div class="bar"><span class="count" id="osm-count"></span></div><div id="osm-card"></div></section>
  <section id="pane-exp" role="tabpanel" aria-labelledby="tab-exp" hidden><div class="bar"><div class="chips" id="exp-chips"></div></div><div id="exp-card"></div></section>
</main>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const store={get(k,d){try{const v=localStorage.getItem('cell:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('cell:'+k,JSON.stringify(v));}catch(e){}}};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/^(the|a|an) /,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function matches(input,aliases){const n=norm(input);if(!n)return false;return aliases.some(a=>{const b=norm(a);if(n===b)return true;const tol=b.length>=10?2:(b.length>=5?1:0);return lev(n,b)<=tol;});}
let tally={right:0,total:0};
function score(ok){tally.total++;if(ok)tally.right++;$('#tally').textContent=tally.right+' / '+tally.total;}
const missMap=()=>store.get('miss',{});
function bump(k,d){const m=missMap();m[k]=Math.max(0,(m[k]||0)+d);store.set('miss',m);}
function filterChips(id,opts,key,onChange){let cur=store.get(key,Object.keys(opts)[0]);if(!opts[cur])cur=Object.keys(opts)[0];
  const draw=()=>{$('#'+id).innerHTML=Object.entries(opts).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${cur===k}">${l}</button>`).join('');
    document.querySelectorAll('#'+id+' .chip').forEach(c=>c.onclick=()=>{cur=c.dataset.k;store.set(key,cur);draw();onChange();});};
  draw();return()=>cur;}

/* ---------- vocabulary (from the class notes, corrected where needed) ---------- */
// term | definition | aliases | group (org = organelle/structure, mem = membrane & transport, life = cells & organisms)
const TERMS=[
 ['Cell','The basic unit of all forms of life.',[],'life'],
 ['Prokaryote','A cell with no nucleus and no membrane-bound organelles. Its DNA floats in the cytoplasm. Example: bacteria.',['prokaryotic','prokaryotes','prokaryotic cell'],'life'],
 ['Eukaryote','A cell with a nucleus and membrane-bound organelles. Examples: animals, plants, fungi, and protists.',['eukaryotic','eukaryotes','eukaryotic cell'],'life'],
 ['Organelle','A specialized structure inside a cell that does a specific job.',['organelles'],'org'],
 ['Cell Membrane','Thin, flexible barrier around the cell. Regulates what comes in and goes out of the cell.',['plasma membrane','cell membranes'],'org'],
 ['Cytoplasm','The watery (aqueous) solution inside the cell that has dissolved substances and organelles in it.',[],'org'],
 ['Flagella','Long, whip-like structure on some cells that is used for movement.',['flagellum'],'org'],
 ['Cilia','Short, hair-like structures on some cells that are used for movement. Smaller than flagella.',['cilium'],'org'],
 ['Ribosome','Makes proteins.',['ribosomes'],'org'],
 ['Cell Wall','Strong, rigid layer around the cell membrane of plants, fungi, algae, and most bacteria. Provides support and protection.',['cell walls'],'org'],
 ['Nucleus','Large structure that contains the cell’s genetic material (DNA). It is surrounded by a nuclear envelope.',['nuclei'],'org'],
 ['Nuclear envelope','Double membrane with pores that surrounds the nucleus.',['nuclear membrane'],'org'],
 ['Nucleolus','Small, dense region inside the nucleus where ribosomes are assembled.',[],'org'],
 ['Cytoskeleton','Network of protein filaments that helps the cell keep its shape.',[],'org'],
 ['Endoplasmic Reticulum','Internal membrane system. Proteins made on its ribosomes are modified, folded, and transported here.',['ER','rough ER','smooth ER'],'org'],
 ['Golgi Apparatus','Modifies proteins (adds lipids and carbohydrates to them) and packages them to be sent out.',['golgi','golgi body','golgi complex'],'org'],
 ['Lysosome','Breaks down waste, like food by-products and old organelles.',['lysosomes'],'org'],
 ['Vacuole','Stores water and other substances. Plants have one large central vacuole. Animal cells have many small ones (vesicles).',['vacuoles','central vacuole'],'org'],
 ['Chloroplast','Site of photosynthesis. Found in plants and some other organisms.',['chloroplasts'],'org'],
 ['Mitochondria','Site of cellular respiration, where energy from food is turned into energy the cell can use (ATP).',['mitochondrion'],'org'],
 ['Centriole','Helps the cell divide. Found in animal cells.',['centrioles'],'org'],
 ['Phospholipid Bilayer','The double layer that makes up the cell membrane. Hydrophilic (water-loving) heads face out toward water, and hydrophobic (water-hating) tails face in.',['lipid bilayer','phospholipid bi layer'],'mem'],
 ['Selectively permeable','Lets some substances pass through the membrane but not others.',['semipermeable','semi permeable','selective permeability'],'mem'],
 ['Passive transport','Movement across the membrane that needs no energy: diffusion, osmosis, and facilitated diffusion.',[],'mem'],
 ['Diffusion','Molecules move from an area of high concentration to an area of low concentration. Requires no energy.',[],'mem'],
 ['Osmosis','The diffusion of water through a selectively permeable membrane. Requires no energy.',[],'mem'],
 ['Facilitated Diffusion','A membrane protein helps a substance diffuse across the membrane, still from high to low concentration. Requires no energy.',[],'mem'],
 ['Active Transport','Proteins pump material from an area of low concentration to an area of high concentration. Requires energy.',[],'mem'],
 ['Isotonic','The solute concentration is the same inside and outside the cell, so there is no net movement of water. The cell stays the same.',[],'mem'],
 ['Hypotonic','The solution has less solute than the cell, so water moves into the cell. Animal cells swell and can burst.',[],'mem'],
 ['Hypertonic','The solution has more solute than the cell, so water moves out of the cell. The cell shrinks, and plant vacuoles collapse.',[],'mem'],

/* ---------- generic engine (multiple choice + typed) ---------- */
function makeEngine(id,gen,opts={}){
  const E={queue:[],cur:null,state:'ask',right:0,total:0,picked:null,typed:''};
  const next=re=>{if(re&&E.cur)E.queue.splice(Math.min(3,E.queue.length),0,{...E.cur,retry:true});
    if(!E.queue.length)E.queue=gen();E.cur=E.queue.shift();E.state='ask';E.picked=null;E.typed='';render();};
  function finish(ok){E.total++;if(ok)E.right++;score(ok);if(E.cur.key)bump(E.cur.key,ok?-1:1);E.state=ok?'right':'wrong';E.miss=!ok;render();}
  function render(){
    const q=E.cur,el=$('#'+id+'-card'),st=E.state;
    if(opts.count) $('#'+id+'-count').textContent=`${E.right} / ${E.total} correct`;
    const fb=st==='ask'?'':`<div class="fb ${st==='right'?'ok':'no'}"><strong>${st==='right'?'Correct.':'Not quite. This one comes back in a few questions.'}</strong>${q.showAns?`<p class="answer">${esc(q.answer)}</p>`:''}${q.why?`<p>${q.why}</p>`:''}</div>`;
    el.innerHTML=`<div class="card"><p class="label">${esc(q.label)}${q.retry?' · try again':''}</p><div class="prompt">${q.prompt}</div>
      <div class="mc">${q.choices.map((c,i)=>{let cls='';if(st!=='ask')cls=c===q.answer?'ok':c===E.picked?'no':'dim';return `<button class="opt ${cls}" data-i="${i}" ${st!=='ask'?'disabled':''}><span class="k">${i+1}</span><span>${esc(c)}</span></button>`;}).join('')}</div>
      ${fb}<div class="row">${st==='ask'?'<span class="kbd">Press 1–4</span>':'<button class="btn primary" id="'+id+'-next">Next</button><span class="kbd">Enter</span>'}</div></div>`;
    if(st==='ask')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{E.picked=q.choices[+b.dataset.i];finish(E.picked===q.answer);});
    else{const b=$('#'+id+'-next');b.onclick=()=>next(E.miss);b.focus();}
  }
  return{start(){E.right=0;E.total=0;E.queue=gen();next();},key(e){if(E.cur&&E.state==='ask'&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`#${id}-card .opt[data-i="${+e.key-1}"]`);if(b)b.click();}}};
}

function mcCompare(){
  const kinds=[
   ['Which is found in plant cells but NOT animal cells?',r=>r[3]&&!r[2]],

const lF=filterChips('label-filter',LF,'labelF',()=>newLabel());
const LB={nums:[],res:null,typed:[],right:0,total:0};
function layout(parts){const L=parts.filter(p=>p.ax<320).sort((a,b)=>a.ay-b.ay),R=parts.filter(p=>p.ax>=320).sort((a,b)=>a.ay-b.ay);
  const pos=new Map();[[L,26],[R,614]].forEach(([col,x])=>col.forEach((p,i)=>pos.set(p.k,[x,38+(i+0.5)*(344/col.length)])));return pos;}
function newLabel(){const d=DIAGRAMS[lF()];LB.nums=shuffle(d.parts.map((_,i)=>i+1));LB.res=null;LB.typed=[];renderLabel();}
function renderLabel(){const d=DIAGRAMS[lF()],pos=layout(d.parts),el=$('#label-card'),done=!!LB.res;
  $('#label-count').textContent=`${LB.right} / ${LB.total} perfect`;
  let s=d.draw();
  d.parts.forEach((p,i)=>{const [bx,by]=pos.get(p.k),n=LB.nums[i],st=done?(LB.res[i]?'ok':'no'):'';
    const x2=bx<320?bx+13:bx-13;
    s+=`<line class="lead" x1="${x2}" y1="${by}" x2="${p.ax}" y2="${p.ay}"/><circle class="pin" cx="${p.ax}" cy="${p.ay}" r="3"/>`;
    s+=`<g class="badge ${st}"><circle cx="${bx}" cy="${by}" r="13"/><text x="${bx}" y="${by+4.5}" text-anchor="middle">${n}</text></g>`;
    if(done)s+=`<text class="nm ${st}" x="${bx<320?bx-2:bx+2}" y="${by+27}" text-anchor="${bx<320?'start':'end'}">${esc(p.k)}</text>`;});
  const order=d.parts.map((p,i)=>({p,i,n:LB.nums[i]})).sort((a,b)=>a.n-b.n);
  const got=done?LB.res.filter(Boolean).length:0;
  el.innerHTML=`<div class="card"><p class="label">${esc(d.title)} · label every numbered part</p>
    <div class="diagram"><svg viewBox="0 0 640 420" role="img" aria-label="${esc(d.title)} diagram with numbered parts">${s}</svg></div>
    <div class="lblgrid">${order.map(({p,i,n})=>`<div class="lbl"><b>${n}</b><input type="text" id="lb-${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name this part" ${done?'readonly':''} value="${esc(LB.typed[i]||'')}" class="${done?(LB.res[i]?'ok':'no'):''}">${done&&!LB.res[i]?`<span class="fix">${esc(p.k)}</span>`:''}</div>`).join('')}</div>
    ${done?`<div class="fb ${got===d.parts.length?'ok':'no'}"><strong>${got} of ${d.parts.length} correct.</strong><p>${got===d.parts.length?'Every label is right.':'Try it again. The numbers get shuffled each time.'}</p></div>`:''}
    <div class="row">${done?'<button class="btn primary" id="lb-again">Try again with new numbers</button>':'<button class="btn primary" id="lb-check">Check labels</button><button class="btn ghost" id="lb-show">Show me</button>'}</div></div>`;
  const inputs=order.map(o=>$('#lb-'+o.i));
  if(!done){inputs[0].focus();
    inputs.forEach((inp,j)=>inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(j<inputs.length-1)inputs[j+1].focus();else $('#lb-check').click();}});
    const check=reveal=>{LB.typed=d.parts.map((_,i)=>$('#lb-'+i).value);LB.res=d.parts.map((p,i)=>!reveal&&matches(LB.typed[i],p.names));
      const ok=LB.res.every(Boolean);LB.total++;if(ok)LB.right++;score(ok);renderLabel();};
    $('#lb-check').onclick=()=>check(false);$('#lb-show').onclick=()=>check(true);

}

/* ---------- OSMOSIS ---------- */
function osmScenario(){
  const kind=pick(['animal','plant','red blood cell']);
  const tone=pick(['Hypotonic','Hypertonic','Isotonic']);
  let cell=ri(2,10),sol=tone==='Isotonic'?cell:tone==='Hypertonic'?cell+ri(2,10):Math.max(0,cell-ri(2,cell));
  if(tone==='Hypotonic'&&sol===cell)sol=0;
  const asWater=Math.random()<.35, sub=pick(['salt','sugar']);
  const noun=kind==='red blood cell'?kind:kind+' cell', A=/^[aeiou]/.test(noun)?'An':'A';
  const txt=asWater?`${A} ${noun} is ${100-cell}% water. It is placed in a solution that is ${100-sol}% water.`:`${A} ${noun} has ${cell}% ${sub} inside. It is placed in a solution that is ${sol}% ${sub}.`;
  const water={Hypotonic:'Into the cell',Hypertonic:'Out of the cell',Isotonic:'No net movement'}[tone];
  const cellA={Hypotonic:'Swells',Hypertonic:'Shrinks',Isotonic:'Stays the same'}[tone];
  const plantNote=kind==='plant'?{Hypotonic:' The plant cell swells and gets firm, but its cell wall keeps it from bursting.',Hypertonic:' The plant cell’s vacuole collapses and the membrane pulls away from the wall.',Isotonic:''}[tone]:{Hypotonic:' An animal cell can swell until it bursts.',Hypertonic:'',Isotonic:''}[tone];
  const conv=asWater?`${100-cell}% water means ${cell}% solute in the cell, and ${100-sol}% water means ${sol}% solute outside. `:'';
  const why=`${conv}The solution has ${sol>cell?'more':sol<cell?'less':'the same'} solute than the cell, so it’s <b>${tone.toLowerCase()}</b>. Water moves toward more solute, so it moves <b>${water.toLowerCase()}</b> and the cell <b>${cellA.toLowerCase()}</b>.${plantNote}`;
  return{kind,cell,sol,asWater,html:esc(txt),ans:{tone,water,cell:cellA},why};
}
const O={s:null,pick:{},done:false,right:0,total:0};
function newOsm(){O.s=osmScenario();O.pick={};O.done=false;renderOsm();}
function beakerSVG(s){const lvl=s.sol>s.cell?'more':s.sol<s.cell?'less':'same';const dots=n=>Array.from({length:n},()=>`<circle cx="${ri(18,132)}" cy="${ri(62,150)}" r="2.2" fill="var(--ink)" opacity=".55"/>`).join('');
  const inside=Array.from({length:Math.min(14,s.cell+2)},()=>`<circle cx="${ri(62,88)}" cy="${ri(96,124)}" r="2.2" fill="var(--nucS)"/>`).join('');
  return `<svg viewBox="0 0 150 165" aria-hidden="true"><path d="M8,10 V155 Q8,160 13,160 H137 Q142,160 142,155 V10" fill="none" stroke="var(--muted)" stroke-width="3"/><rect x="11" y="52" width="128" height="105" fill="var(--vac)" opacity=".7"/>${dots(Math.min(40,Math.round(s.sol*2.5)))}<circle cx="75" cy="110" r="24" fill="var(--cyto)" stroke="var(--memb)" stroke-width="2.5"/>${inside}</svg>`;}
function renderOsm(){const s=O.s,el=$('#osm-card'),done=O.done;$('#osm-count').textContent=`${O.right} / ${O.total} correct`;
  const qs=[['tone','The solution outside is…',['Hypotonic','Hypertonic','Isotonic']],['water','Water moves…',['Into the cell','Out of the cell','No net movement']],['cell','The cell…',['Swells','Shrinks','Stays the same']]];
  el.innerHTML=`<div class="card"><p class="label">Osmosis</p><div class="beaker">${beakerSVG(s)}<p class="prompt" style="flex:1;min-width:200px">${s.html}</p></div>
    <div class="seg3">${qs.map(([k,q,opts])=>`<div class="q"><b>${q}</b><div class="opts">${opts.map(o=>{let cls='';if(done)cls=o===s.ans[k]?'ok':o===O.pick[k]?'no':'';return `<button data-k="${k}" data-o="${esc(o)}" aria-pressed="${O.pick[k]===o}" class="${cls}" ${done?'disabled':''}>${esc(o)}</button>`;}).join('')}</div></div>`).join('')}</div>
    ${done?`<div class="fb ${qs.every(([k])=>O.pick[k]===s.ans[k])?'ok':'no'}"><strong>${qs.every(([k])=>O.pick[k]===s.ans[k])?'All three correct.':'Not quite.'}</strong><p>${s.why}</p></div>`:''}
    <div class="row">${done?'<button class="btn primary" id="o-next">Next scenario</button>':`<button class="btn primary" id="o-check" ${Object.keys(O.pick).length<3?'disabled':''}>Check</button>`}</div></div>`;
  if(!done){el.querySelectorAll('.seg3 button').forEach(b=>b.onclick=()=>{O.pick[b.dataset.k]=b.dataset.o;renderOsm();});
    $('#o-check').onclick=()=>{O.done=true;const ok=['tone','water','cell'].every(k=>O.pick[k]===s.ans[k]);O.total++;if(ok)O.right++;score(ok);renderOsm();};}
  else{$('#o-next').onclick=newOsm;$('#o-next').focus();}}
